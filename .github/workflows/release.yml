name: release

# Build the CorvusSKK x64 stack in CI with clang-cl + lld-link + xwin (no Visual Studio),
# mirroring tools/build-windows.ps1. Every run uploads a workflow artifact; pushing a
# tag (v*) additionally publishes a GitHub Release with the 5-file bundle.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put LLVM on PATH (clang-cl / lld-link / llvm-rc / llvm-lib)
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      - name: Fetch xwin
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod "https://api.github.com/repos/Jake-Shadle/xwin/releases/latest").tag_name.TrimStart('v')
          $name = "xwin-$ver-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Force build\tools | Out-Null
          curl.exe -L -o xwin.tar.gz "https://github.com/Jake-Shadle/xwin/releases/download/$ver/$name.tar.gz"
          tar -xf xwin.tar.gz
          Copy-Item "$name\xwin.exe" build\tools\xwin.exe

      - name: Splat MSVC CRT / ATL / SDK via xwin
        shell: pwsh
        run: build\tools\xwin.exe --accept-license --include-atl --arch x86_64 --cache-dir build\xwin-cache splat --output build\xwin-msvc

      - name: Build (tools/build-windows.ps1)
        shell: pwsh
        run: .\tools\build-windows.ps1

      - name: Package
        shell: pwsh
        run: |
          $out = "build\win-xwin"
          Compress-Archive -Force -DestinationPath corvusskk-x64.zip -Path `
            "$out\imcrvtip.dll", "$out\imcrvmgr.exe", "$out\imcrvcnf.exe", "$out\lua55.dll", "$out\zlib1.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: corvusskk
          path: corvusskk-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/corvusskk/corvusskk-x64.zip
